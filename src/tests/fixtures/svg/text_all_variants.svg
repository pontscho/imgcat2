<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" fill="#f5f5f5"/>

  <!-- Title -->
  <text x="200" y="30" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">
    Font Variants Test
  </text>

  <!-- Regular -->
  <text x="20" y="70" font-family="DejaVu Sans Mono" font-size="16" fill="black">
    Regular: The quick brown fox
  </text>

  <!-- Bold -->
  <text x="20" y="100" font-family="DejaVu Sans Mono" font-size="16" font-weight="bold" fill="blue">
    Bold: The quick brown fox
  </text>

  <!-- Italic -->
  <text x="20" y="130" font-family="DejaVu Sans Mono" font-size="16" font-style="italic" fill="green">
    Italic: The quick brown fox
  </text>

  <!-- Bold-Italic -->
  <text x="20" y="160" font-family="DejaVu Sans Mono" font-size="16" font-weight="bold" font-style="italic" fill="red">
    Bold-Italic: The quick brown fox
  </text>
</svg>
